<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morning Pages - Daily Bible Study</title>
    
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>
<body>
    <div class="header">
        <button onclick="window.print()" id="print-button">Print/Save to PDF</button>
    </div>

    <div id= "date-header" class="date-header"></div>

    <!-- This section is for the Bible excerpt for Today's Study -->
    <div id="read-box" class="read">
       
        <div class="section-title">Read</div>

        <div class="content">
            <div id="scripture-verses" class="scripture-verses"></div>
            <div id="scripture-reference" class="scripture-reference"></div>
        </div>

    </div>

    <!-- This section is for the journaling questions for Today's Study -->
    <div id="ask-box" class="ask">
        <div class="section-title">Ask</div>

        <div class="content">
            
            <div class="question-box">
                <div id="ask-box-one" class="question-title"></div>
                <textarea
                 id="question-answer-box-one",
                 name="questionAnswerBoxOne",
                 rows="8",
                 cols="36",
                 placeholder="Answer here..."></textarea>
            </div>
            
            <div class="question-box">
                <div id="ask-box-two" class="question-title"></div>
                <textarea
                 id="question-answer-box-two",
                 name="questionAnswerBoxTwo",
                 rows="8",
                 cols="36",
                 placeholder="Answer here..."></textarea>
            </div>

        </div>
    </div>

    <!-- This section is for the prayer for Today's Study -->    
    <div class="pray">
        <div class="section-title">Pray</div>

        <div id="pray-box" class="content"></div>
    </div>
     

    <div class="footer"></div>

</body>
</html>
